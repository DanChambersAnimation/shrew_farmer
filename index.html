<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrew Farmer</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="gambit-rack-slot"></div>
    <section id="round-meter" aria-label="Round timer" hidden>
      <div class="round-meter-heading">
        <span>ROUND</span>
        <strong id="round-meter-remaining">60s</strong>
      </div>
      <div
        id="round-meter-track"
        role="progressbar"
        aria-label="Round progress"
        aria-valuemin="0"
        aria-valuemax="60"
        aria-valuenow="0"
      >
        <div id="round-meter-fill"></div>
        <div id="round-meter-marker" aria-hidden="true">★</div>
      </div>
    </section>
    <div id="room-label"></div>
    <div id="info" hidden>
      <h2></h2>
      <p></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
